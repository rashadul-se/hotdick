# Render Blueprint. Replace YOUR_ORG and the image tag; confirm plan names in the Render dashboard.
services:
  - type: web
    name: meridian
    runtime: docker
    dockerfilePath: ./Containerfile
    dockerContext: .
    image:
      url: ghcr.io/YOUR_ORG/meridian:1.0.0
      creds:
        fromRegistryCreds:
          name: ghcr-creds
    plan: standard
    healthCheckPath: /_stcore/health
    envVars:
      - key: PORT
        value: "8501"
      - key: COOKIE_SECURE
        value: "1"
      - key: DB_POOL_MAX
        value: "15"
      - key: DATABASE_URL
        fromDatabase:
          name: meridian-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: meridian-cache
          property: connectionString
      - key: PUBLIC_URL      # e.g. https://news.example.com
        sync: false
      - key: DESK_KEYS       # JSON of desk keys and scopes
        sync: false
      - key: ADSENSE_CLIENT  # leave empty to keep ads off
        sync: false
  - type: keyvalue
    name: meridian-cache
    plan: starter
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []          # internal access only
databases:
  - name: meridian-db
    plan: basic-256mb
    postgresMajorVersion: "16"
