# Render Blueprint: Daily FoT (builds from this repo, no registry needed).
# Place this file, Containerfile, app.py and requirements.txt at the repo root.
# If they live in a subfolder, change dockerfilePath and dockerContext (e.g. ./meridian/Containerfile, ./meridian).
# Confirm plan names in the Render dashboard before applying.
services:
  - type: web
    name: meridian
    runtime: docker
    dockerfilePath: ./Containerfile
    dockerContext: .
    plan: standard
    healthCheckPath: /_stcore/health
    envVars:
      - key: PORT
        value: "8501"
      - key: COOKIE_SECURE
        value: "1"
      - key: DB_POOL_MAX
        value: "15"
      - key: DATABASE_URL
        fromDatabase:
          name: meridian-db
          property: connectionString
      # Four databases: white = news/editorial, blue = HR (reserved), reporters, community.
      # Delete the DATABASE_URL_* lines (and the three extra databases below) to run everything in meridian-db.
      - key: DATABASE_URL_WHITE
        fromDatabase:
          name: meridian-db
          property: connectionString
      - key: DATABASE_URL_BLUE
        fromDatabase:
          name: meridian-blue
          property: connectionString
      - key: DATABASE_URL_REPORTERS
        fromDatabase:
          name: meridian-reporters
          property: connectionString
      - key: DATABASE_URL_COMMUNITY
        fromDatabase:
          name: meridian-community
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: meridian-cache
          property: connectionString
      - key: PUBLIC_URL      # e.g. https://news.example.com
        sync: false
      - key: DESK_KEYS       # JSON of desk keys and scopes
        sync: false
      - key: EDITOR_INVITE_CODE  # secret code that lets a person register as an editor
        sync: false
      - key: RATE_PER_STORY
        value: "20"
      - key: CURRENCY
        value: "BDT"
      - key: NEWSROOM_TZ
        value: "Asia/Dhaka"
      - key: PUBLISH_GAP_MIN
        value: "15"
      - key: REVIEW_SLA_MIN
        value: "60"
      - key: SUBMITS_PER_HOUR
        value: "5"
      # Google sign-in (optional): leave GOOGLE_CLIENT_ID blank to switch it off
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: AUTH_COOKIE_SECRET
        generateValue: true
      # Footer text (edit any value in the Render dashboard; blank items are hidden)
      - key: FOOTER_COMPANY
        value: "Daily Flaws of Tomorrow (dFoT)"
      - key: FOOTER_REGION
        value: "Asia Pacific"
      - key: FOOTER_EDITOR
        value: "Jojo"
      - key: FOOTER_PUBLISHER
        value: "Rasha"
      - key: FOOTER_PHONE
        sync: false
      - key: FOOTER_FACTCHECK
        sync: false
      - key: FOOTER_EMAILS
        value: "info.dfot@gmail.com"
      - key: FOOTER_ADDRESS
        sync: false
      - key: FOOTER_SOCIAL
        sync: false
      # Optional: name of your own Dewey script (a .py file next to app.py with classify(title, summary, body))
      - key: DEWEY_MODULE
        sync: false
      - key: ADSENSE_CLIENT  # leave empty to keep ads off
        sync: false

  - type: keyvalue
    name: meridian-cache
    plan: starter
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []          # internal access only

databases:
  - name: meridian-db
    plan: basic-256mb
    postgresMajorVersion: "16"
  - name: meridian-blue
    plan: basic-256mb
    postgresMajorVersion: "16"
  - name: meridian-reporters
    plan: basic-256mb
    postgresMajorVersion: "16"
  - name: meridian-community
    plan: basic-256mb
    postgresMajorVersion: "16"
