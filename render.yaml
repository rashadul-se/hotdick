# Render Blueprint: Meridian Daily (builds from this repo, no registry needed).
# Place this file, Containerfile, app.py and requirements.txt at the repo root.
# If they live in a subfolder, change dockerfilePath and dockerContext (e.g. ./meridian/Containerfile, ./meridian).
# Confirm plan names in the Render dashboard before applying.
services:
  - type: web
    name: FoT
    runtime: docker
    dockerfilePath: ./Containerfile
    dockerContext: .
    plan: standard
    healthCheckPath: /_stcore/health
    envVars:
      - key: PORT
        value: "8501"
      - key: COOKIE_SECURE
        value: "1"
      - key: DB_POOL_MAX
        value: "15"
      - key: DATABASE_URL
        fromDatabase:
          name: meridian-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: meridian-cache
          property: connectionString
      - key: PUBLIC_URL      # e.g. https://news.example.com
        sync: false
      - key: DESK_KEYS       # JSON of desk keys and scopes
        sync: false
      - key: EDITOR_INVITE_CODE  # secret code that lets a person register as an editor
        sync: false
      - key: RATE_PER_STORY
        value: "20"
      - key: CURRENCY
        value: "BDT"
      - key: ADSENSE_CLIENT  # leave empty to keep ads off
        sync: false

  - type: keyvalue
    name: meridian-cache
    plan: starter
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []          # internal access only

databases:
  - name: meridian-db
    plan: basic-256mb
    postgresMajorVersion: "16"
