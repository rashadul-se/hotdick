# podman kube play k8s.yaml   (local)   |   kubectl/oc apply -f k8s.yaml   (cluster)
apiVersion: v1
kind: Secret
metadata: {name: meridian-secrets}
stringData:
  DATABASE_URL: postgresql://news:CHANGE_ME@postgres:5432/news
  REDIS_URL: redis://redis:6379/0
  PUBLIC_URL: https://news.example.com
  DESK_KEYS: '{"sylhet":{"key":"<fernet-key>","scopes":["publish:national","publish:world"],"ttl":172800}}'
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: meridian}
spec:
  replicas: 40            # ~5,000 live readers at ~125 sessions/pod; Streamlit holds one websocket + thread per reader
  selector: {matchLabels: {app: meridian}}
  strategy: {rollingUpdate: {maxUnavailable: 0, maxSurge: 25%}}
  template:
    metadata: {labels: {app: meridian}}
    spec:
      topologySpreadConstraints:
        - {maxSkew: 1, topologyKey: kubernetes.io/hostname, whenUnsatisfiable: ScheduleAnyway, labelSelector: {matchLabels: {app: meridian}}}
      containers:
        - name: app
          image: registry.example.com/meridian:1.0
          ports: [{containerPort: 8501}]
          envFrom: [{secretRef: {name: meridian-secrets}}]
          env: [{name: DB_POOL_MAX, value: "10"}]
          resources: {requests: {cpu: 250m, memory: 2Gi}, limits: {cpu: "1", memory: 4Gi}}
          readinessProbe: {httpGet: {path: /_stcore/health, port: 8501}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /_stcore/health, port: 8501}, initialDelaySeconds: 20}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata: {name: meridian}
spec: {selector: {app: meridian}, ports: [{port: 80, targetPort: 8501}]}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: meridian}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: meridian}
  minReplicas: 6
  maxReplicas: 80
  metrics: [{type: Resource, resource: {name: cpu, target: {type: Utilization, averageUtilization: 65}}}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: meridian}
spec: {minAvailable: 70%, selector: {matchLabels: {app: meridian}}}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: meridian
  annotations:           # sticky sessions + websocket timeouts (Streamlit requirement)
    nginx.ingress.kubernetes.io/affinity: cookie
    nginx.ingress.kubernetes.io/session-cookie-name: dm_route
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  tls: [{hosts: [news.example.com], secretName: news-tls}]
  rules:
    - host: news.example.com
      http: {paths: [{path: /, pathType: Prefix, backend: {service: {name: meridian, port: {number: 80}}}}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: redis}
spec:
  replicas: 1
  selector: {matchLabels: {app: redis}}
  template:
    metadata: {labels: {app: redis}}
    spec:
      containers:
        - {name: redis, image: docker.io/library/redis:7-alpine, args: ["--maxmemory","1gb","--maxmemory-policy","allkeys-lru"], ports: [{containerPort: 6379}]}
---
apiVersion: v1
kind: Service
metadata: {name: redis}
spec: {selector: {app: redis}, ports: [{port: 6379}]}
# OpenShift: replace Ingress with a Route (edge TLS, haproxy.router.openshift.io/disable_cookies: "false").
# Postgres: use a managed service or CloudNativePG with the pgvector image, behind PgBouncer.
